name: Roll back expandable layout
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1529a67f10eba11209d0f11aefbab89e21c931b2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-engine.cjs
      - run: node scripts/test-auth.cjs
      - run: node scripts/test-analytics.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy previous layout
        id: deployment
        uses: actions/deploy-pages@v4
