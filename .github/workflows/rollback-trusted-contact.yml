name: Roll back Trusted Contact Authentication
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Dedicated, tested restoration of the pre-auth app plus cache retirement.
          ref: be5f131f45a78ae51e3796ecebe10fccd002548b
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-engine.cjs
      - run: node scripts/test-rollback.cjs
      - run: node --check dist/app.js && node --check dist/sw.js && node --check dist/rollback-cleanup.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy rollback
        id: deployment
        uses: actions/deploy-pages@v4
